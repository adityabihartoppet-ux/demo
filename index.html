<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>Pro Multi-Tool: PDF Maker & Photo Editor</title>
    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Cropper.js for Image Cropping -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            gap: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-sizing: border-box;
        }

        h2 { margin-top: 0; color: #1e293b; font-weight: 700; font-size: 1.8rem;}
        h3 { color: #334155; margin-bottom: 15px; font-size: 1.2rem; font-weight: 600; text-align: left;}

        /* Drag & Drop Upload Section */
        .upload-dashed-container {
            width: 100%;
            padding: 40px 20px;
            background-color: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-sizing: border-box;
            position: relative;
        }
        .upload-dashed-container:hover, .upload-dashed-container.dragover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        
        #pdf-dropzone:hover, #pdf-dropzone.dragover { border-color: #a855f7; background-color: #faf5ff; }

        .upload-icon-large {
            font-size: 70px;
            color: #94a3b8;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .upload-dashed-container:hover .upload-icon-large { color: #3b82f6; transform: scale(1.1); }
        #pdf-dropzone:hover .upload-icon-large { color: #a855f7; }

        .file-name-display { font-size: 14px; color: #64748b; margin-top: 15px; font-weight: 500; }

        /* Form Inputs & Sliders */
        .input-group { margin-top: 15px; text-align: left; }
        .input-group label { display: block; font-size: 14px; margin-bottom: 6px; color: #475569; font-weight: 600; }
        .row { display: flex; gap: 15px; flex-wrap: wrap;}
        .row .input-group { flex: 1; min-width: 120px; }
        
        input[type="number"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            color: #334155;
            background: #fff;
            transition: 0.3s;
        }
        input[type="number"]:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        input[type="color"] { width: 100%; height: 42px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 2px; cursor: pointer; }
        
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #3b82f6; }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            font-size: 14px;
            color: #475569;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-weight: 500;
        }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; accent-color: #3b82f6; }

        /* Buttons */
        button, .btn-link {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(59,130,246,0.25);
            display: block;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }
        button:hover, .btn-link:hover { background-color: #2563eb; transform: translateY(-2px); }
        
        .btn-success { background-color: #10b981; box-shadow: 0 4px 12px rgba(16,185,129,0.25);}
        .btn-success:hover { background-color: #059669; }
        
        .btn-danger { background-color: #ef4444; margin-top: 12px; box-shadow: 0 4px 12px rgba(239,68,68,0.25);}
        .btn-danger:hover { background-color: #dc2626; }

        .btn-pdf { background-color: #8b5cf6; box-shadow: 0 4px 12px rgba(139,92,246,0.25); }
        .btn-pdf:hover { background-color: #7c3aed; }

        /* Editor Workspaces */
        #pdf-options, #options-section, #result-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-top: 20px;
        }

        .hidden { display: none !important; }
        .preview-img { max-width: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .info-text { font-size: 14px; color: #475569; margin-top: 15px; background-color: #f1f5f9; padding: 12px; border-radius: 8px; font-weight: 500;}
        
        /* Cropper Container */
        .img-container { width: 100%; max-height: 400px; margin-bottom: 20px; background-color: #e2e8f0; border-radius: 8px; overflow: hidden; }
        .img-container img { max-width: 100%; display: block; }
    </style>
</head>
<body>

<!-- ================= PDF MAKER SECTION ================= -->
<div class="container">
    <h2>Pro PDF Maker</h2>
    <input type="file" id="pdf-upload" accept="image/*" multiple class="hidden">

    <div class="upload-dashed-container" id="pdf-dropzone">
        <div class="upload-icon-large">
            <i class="fa-solid fa-file-pdf"></i>
        </div>
        <h3>Click or Drag & Drop Images Here</h3>
        <p style="color:#64748b; font-size:13px;">Select multiple images to convert into a single PDF</p>
    </div>
    
    <p id="pdf-file-name-display" class="file-name-display"></p>

    <!-- Extra PDF Features -->
    <div id="pdf-options" class="hidden">
        <h3>PDF Settings</h3>
        <div class="row">
            <div class="input-group">
                <label>Page Size</label>
                <select id="pdf-page-size">
                    <option value="a4">A4 (Standard)</option>
                    <option value="letter">Letter</option>
                    <option value="fit">Fit to Image Size</option>
                </select>
            </div>
            <div class="input-group">
                <label>Orientation</label>
                <select id="pdf-orientation">
                    <option value="p">Portrait</option>
                    <option value="l">Landscape</option>
                </select>
            </div>
        </div>
        <div class="input-group">
            <label>Page Margin</label>
            <select id="pdf-margin">
                <option value="0">No Margin (Full Page)</option>
                <option value="10">Small Margin</option>
                <option value="20">Large Margin</option>
            </select>
        </div>
        <button id="generate-pdf-btn" class="btn-pdf"><i class="fa-solid fa-file-export"></i> Generate & Download PDF</button>
        <p id="pdf-status" class="info-text hidden" style="text-align:center; color: #8b5cf6;"></p>
    </div>
</div>


<!-- ================= PHOTO RESIZER & EDITOR SECTION ================= -->
<div class="container">
    <h2>Photo Editor & Resizer</h2>
    
    <div id="upload-section">
        <input type="file" id="image-upload" accept="image/*" class="hidden">
        <div class="upload-dashed-container" id="img-dropzone">
            <div class="upload-icon-large">
                <i class="fa-regular fa-image"></i>
            </div>
            <h3>Click or Drag & Drop Image Here</h3>
            <p style="color:#64748b; font-size:13px;">Upload an image to crop, edit, and resize</p>
        </div>
    </div>

    <!-- Workspace for Editing -->
    <div id="options-section" class="hidden">
        <h3>1. Crop & Adjust</h3>
        <div class="img-container">
            <img id="cropper-image" src="" alt="Picture">
        </div>

        <div class="row">
            <div class="input-group">
                <label><i class="fa-solid fa-sun"></i> Brightness: <span id="bright-val">100</span>%</label>
                <input type="range" id="filter-brightness" min="0" max="200" value="100">
            </div>
            <div class="input-group">
                <label><i class="fa-solid fa-circle-half-stroke"></i> Contrast: <span id="contrast-val">100</span>%</label>
                <input type="range" id="filter-contrast" min="0" max="200" value="100">
            </div>
            <div class="input-group">
                <label><i class="fa-solid fa-droplet"></i> Saturation: <span id="saturate-val">100</span>%</label>
                <input type="range" id="filter-saturate" min="0" max="200" value="100">
            </div>
        </div>

        <hr style="border: 1px solid #e2e8f0; margin: 25px 0;">

        <h3>2. Resize Settings</h3>
        <div class="row">
            <div class="input-group">
                <label>Width (px)</label>
                <input type="number" id="img-width">
            </div>
            <div class="input-group">
                <label>Height (px)</label>
                <input type="number" id="img-height">
            </div>
        </div>
        
        <!-- Conditional Background Checkbox -->
        <div class="checkbox-group">
            <input type="checkbox" id="maintain-ratio">
            <label for="maintain-ratio">Add Background (Don't stretch if expanding)</label>
        </div>
        
        <div class="input-group hidden" id="bg-color-group">
            <label>Background Color</label>
            <input type="color" id="bg-color" value="#FFFFFF">
        </div>

        <div class="row">
            <div class="input-group">
                <label>Target Size (KB)</label>
                <input type="number" id="img-size" placeholder="Leave empty for original">
            </div>
            <div class="input-group">
                <label>Format</label>
                <select id="img-format">
                    <option value="image/jpeg">.JPG (Best for compression)</option>
                    <option value="image/png">.PNG (High Quality)</option>
                </select>
            </div>
            <div class="input-group">
                <label>DPI (Optional)</label>
                <input type="number" id="img-dpi" placeholder="e.g. 300">
            </div>
        </div>
        
        <button id="edit-btn"><i class="fa-solid fa-wand-magic-sparkles"></i> Apply Filters & Resize</button>
    </div>

    <!-- Final Result -->
    <div id="result-section" class="hidden">
        <h3>Your Final Masterpiece:</h3>
        <img id="result-img" class="preview-img" src="" alt="Resized Image">
        <p id="final-info" class="info-text"></p>
        <a id="download-link" class="btn-link btn-success" href="" download="edited_image"><i class="fa-solid fa-download"></i> Download Photo</a>
        <button id="reset-btn" class="btn-danger"><i class="fa-solid fa-rotate-left"></i> Edit Another Photo</button>
    </div>
</div>

<script>
    // ================= DRAG & DROP LOGIC =================
    const setupDragDrop = (dropzoneId, inputId, callback) => {
        const dropzone = document.getElementById(dropzoneId);
        const input = document.getElementById(inputId);

        dropzone.addEventListener('click', () => input.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });
        dropzone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
        });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                input.files = e.dataTransfer.files;
                input.dispatchEvent(new Event('change')); // Trigger change event
            }
        });
    };

    setupDragDrop('pdf-dropzone', 'pdf-upload');
    setupDragDrop('img-dropzone', 'image-upload');


    // ================= SCRIPT FOR PDF MAKER =================
    const pdfUpload = document.getElementById('pdf-upload');
    const pdfFileNameDisplay = document.getElementById('pdf-file-name-display');
    const generatePdfBtn = document.getElementById('generate-pdf-btn');
    const pdfStatus = document.getElementById('pdf-status');
    const pdfOptions = document.getElementById('pdf-options');

    pdfUpload.addEventListener('change', () => {
        const files = pdfUpload.files;
        if (files.length > 0) {
            pdfFileNameDisplay.innerHTML = `<i class="fa-solid fa-check-circle" style="color:#10b981;"></i> Selected: ${files.length} Image(s)`;
            pdfOptions.classList.remove('hidden'); // Show extra settings
        } else {
            pdfFileNameDisplay.innerText = "";
            pdfOptions.classList.add('hidden');
        }
    });

    const readFileAsDataURL = (file) => {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
        });
    };

    const getImageDimensions = (dataURL) => {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve({ width: img.width, height: img.height });
            img.src = dataURL;
        });
    };

    generatePdfBtn.addEventListener('click', async () => {
        const files = pdfUpload.files;
        if (files.length === 0) return;

        pdfStatus.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Generating PDF, please wait...";
        pdfStatus.classList.remove('hidden');

        const { jsPDF } = window.jspdf;
        const pageSize = document.getElementById('pdf-page-size').value;
        const orientation = document.getElementById('pdf-orientation').value;
        const marginStr = parseInt(document.getElementById('pdf-margin').value);
        
        let pdf = new jsPDF(orientation, 'mm', pageSize === 'fit' ? 'a4' : pageSize);

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const dataURL = await readFileAsDataURL(file);
            const dimensions = await getImageDimensions(dataURL);

            // If "Fit to Image" is selected, create dynamic page size based on pixels (converted roughly to mm)
            if (pageSize === 'fit') {
                const imgWidthMm = dimensions.width * 0.264583; // px to mm approx
                const imgHeightMm = dimensions.height * 0.264583;
                if (i === 0) {
                    pdf = new jsPDF(imgWidthMm > imgHeightMm ? 'l' : 'p', 'mm', [imgWidthMm, imgHeightMm]);
                } else {
                    pdf.addPage([imgWidthMm, imgHeightMm], imgWidthMm > imgHeightMm ? 'l' : 'p');
                }
            } else if (i > 0) {
                pdf.addPage();
            }

            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            
            // Calculate usable area after margin
            const usableWidth = pdfWidth - (marginStr * 2);
            const usableHeight = pdfHeight - (marginStr * 2);

            const imgRatio = dimensions.width / dimensions.height;
            const pdfRatio = usableWidth / usableHeight;

            let finalWidth = usableWidth;
            let finalHeight = usableHeight;

            if (imgRatio > pdfRatio) {
                finalHeight = usableWidth / imgRatio;
            } else {
                finalWidth = usableHeight * imgRatio;
            }

            // Center image within margins
            const x = marginStr + ((usableWidth - finalWidth) / 2);
            const y = marginStr + ((usableHeight - finalHeight) / 2);

            pdf.addImage(dataURL, 'JPEG', x, y, finalWidth, finalHeight);
        }

        pdf.save('MultiTool_Document.pdf');
        
        pdfStatus.innerHTML = "<i class='fa-solid fa-circle-check'></i> PDF Downloaded Successfully!";
        pdfStatus.style.color = "#10b981";
        
        setTimeout(() => {
            pdfUpload.value = "";
            pdfFileNameDisplay.innerText = "";
            pdfOptions.classList.add('hidden');
            pdfStatus.classList.add('hidden');
        }, 3000);
    });

    // ================= SCRIPT FOR PHOTO EDITOR =================
    let cropper;
    let originalFileName = "";
    
    const fileInput = document.getElementById('image-upload');
    const uploadSection = document.getElementById('upload-section');
    const optionsSection = document.getElementById('options-section');
    const cropperImage = document.getElementById('cropper-image');
    
    const widthInput = document.getElementById('img-width');
    const heightInput = document.getElementById('img-height');
    const maintainRatioCheck = document.getElementById('maintain-ratio');
    const bgColorGroup = document.getElementById('bg-color-group');
    const bgColorInput = document.getElementById('bg-color');
    const sizeInput = document.getElementById('img-size');
    const dpiInput = document.getElementById('img-dpi');
    const formatSelect = document.getElementById('img-format');
    
    // Filters
    const bSlider = document.getElementById('filter-brightness');
    const cSlider = document.getElementById('filter-contrast');
    const sSlider = document.getElementById('filter-saturate');
    const bVal = document.getElementById('bright-val');
    const cVal = document.getElementById('contrast-val');
    const sVal = document.getElementById('saturate-val');

    const updateFilterDisplay = () => {
        bVal.innerText = bSlider.value;
        cVal.innerText = cSlider.value;
        sVal.innerText = sSlider.value;
        const filterStr = `brightness(${bSlider.value}%) contrast(${cSlider.value}%) saturate(${sSlider.value}%)`;
        document.querySelector('.cropper-view-box img').style.filter = filterStr; // Apply preview to cropper box
    };

    [bSlider, cSlider, sSlider].forEach(slider => slider.addEventListener('input', updateFilterDisplay));

    // Show/Hide Color Picker Logic
    maintainRatioCheck.addEventListener('change', function() {
        if (this.checked) {
            bgColorGroup.classList.remove('hidden');
        } else {
            bgColorGroup.classList.add('hidden');
        }
    });

    fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;

        originalFileName = file.name.split('.')[0];
        sizeInput.value = Math.round(file.size / 1024); // Suggest original KB size
        
        const reader = new FileReader();
        reader.onload = function(e) {
            cropperImage.src = e.target.result;
            uploadSection.classList.add('hidden');
            optionsSection.classList.remove('hidden');
            
            // Initialize Cropper.js
            if(cropper) cropper.destroy();
            cropper = new Cropper(cropperImage, {
                viewMode: 1,
                autoCropArea: 1,
                crop(event) {
                    // Update Width/Height dynamically as user crops
                    widthInput.value = Math.round(event.detail.width);
                    heightInput.value = Math.round(event.detail.height);
                }
            });
            
            // Reset filters
            bSlider.value = 100; cSlider.value = 100; sSlider.value = 100; updateFilterDisplay();
        };
        reader.readAsDataURL(file);
    });

    function changeDpiDataUrl(base64Image, dpi) {
        if (!base64Image.startsWith('data:image/jpeg')) return base64Image;
        let data = atob(base64Image.split(',')[1]);
        let dataArray = new Uint8Array(data.length);
        for (let i = 0; i < data.length; i++) dataArray[i] = data.charCodeAt(i);
        if (dataArray[0] === 0xFF && dataArray[1] === 0xD8) {
            let offset = 2;
            while (offset < dataArray.length) {
                if (dataArray[offset] === 0xFF && dataArray[offset + 1] === 0xE0) {
                    dataArray[offset + 7] = 1;
                    dataArray[offset + 8] = Math.floor(dpi / 256); dataArray[offset + 9] = dpi % 256;
                    dataArray[offset + 10] = Math.floor(dpi / 256); dataArray[offset + 11] = dpi % 256;
                    break;
                }
                offset += 2 + (dataArray[offset + 2] << 8) + dataArray[offset + 3];
            }
        }
        let output = '';
        for (let i = 0; i < dataArray.length; i++) output += String.fromCharCode(dataArray[i]);
        return 'data:image/jpeg;base64,' + btoa(output);
    }

    document.getElementById('edit-btn').addEventListener('click', () => {
        const newWidth = parseInt(widthInput.value);
        const newHeight = parseInt(heightInput.value);
        const format = formatSelect.value;
        const targetKB = parseInt(sizeInput.value);
        const addBackground = maintainRatioCheck.checked;
        const bgColor = bgColorInput.value;
        const targetDpi = parseInt(dpiInput.value);

        // 1. Get cropped image from Cropper.js
        let croppedCanvas = cropper.getCroppedCanvas();
        
        // 2. Apply Filters to a temporary canvas
        const filterCanvas = document.createElement('canvas');
        filterCanvas.width = croppedCanvas.width;
        filterCanvas.height = croppedCanvas.height;
        const fCtx = filterCanvas.getContext('2d');
        fCtx.filter = `brightness(${bSlider.value}%) contrast(${cSlider.value}%) saturate(${sSlider.value}%)`;
        fCtx.drawImage(croppedCanvas, 0, 0);

        // 3. Final Resize & Background Logic
        const finalCanvas = document.createElement('canvas');
        const ctx = finalCanvas.getContext('2d');
        finalCanvas.width = newWidth;
        finalCanvas.height = newHeight;

        const isExpanding = newWidth > filterCanvas.width || newHeight > filterCanvas.height;

        if (format === 'image/jpeg' || (addBackground && isExpanding)) {
            ctx.fillStyle = (addBackground && isExpanding) ? bgColor : '#FFFFFF'; // JPEG needs white bg naturally
            ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
        } else {
            ctx.clearRect(0, 0, finalCanvas.width, finalCanvas.height);
        }

        if (addBackground && isExpanding) {
            // Letterbox
            const ratio = Math.min(newWidth / filterCanvas.width, newHeight / filterCanvas.height);
            const drawWidth = filterCanvas.width * ratio;
            const drawHeight = filterCanvas.height * ratio;
            const offsetX = (newWidth - drawWidth) / 2;
            const offsetY = (newHeight - drawHeight) / 2;
            ctx.drawImage(filterCanvas, offsetX, offsetY, drawWidth, drawHeight);
        } else {
            // Stretch / Direct Resize
            ctx.drawImage(filterCanvas, 0, 0, newWidth, newHeight);
        }

        // 4. Binary Search Compression Logic
        let dataUrl = finalCanvas.toDataURL(format, 1.0);
        
        if (targetKB && targetKB > 0 && format === 'image/jpeg') {
            let minQ = 0.01, maxQ = 1.0, bestQ = 1.0;
            let attempts = 0;
            while (attempts < 8) {
                bestQ = (minQ + maxQ) / 2;
                dataUrl = finalCanvas.toDataURL(format, bestQ);
                let currentKB = Math.round((dataUrl.length * 0.75) / 1024);
                if (currentKB > targetKB) maxQ = bestQ; 
                else minQ = bestQ;
                attempts++;
            }
            dataUrl = finalCanvas.toDataURL(format, minQ);
        }

        // Apply DPI
        if (targetDpi && targetDpi > 0 && format === 'image/jpeg') {
            dataUrl = changeDpiDataUrl(dataUrl, targetDpi);
        }

        // Display Results
        document.getElementById('result-img').src = dataUrl;
        const dlLink = document.getElementById('download-link');
        dlLink.href = dataUrl;
        dlLink.download = originalFileName + '_pro_edited' + (format === 'image/jpeg' ? '.jpg' : '.png');

        let finalKB = Math.round((dataUrl.length * 0.75) / 1024);
        document.getElementById('final-info').innerHTML = `<b>Final Size:</b> ~${finalKB} KB <br> <b>Dimensions:</b> ${newWidth}x${newHeight}px`;

        optionsSection.classList.add('hidden');
        document.getElementById('result-section').classList.remove('hidden');
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
        fileInput.value = "";
        if(cropper) cropper.destroy();
        document.getElementById('result-section').classList.add('hidden');
        uploadSection.classList.remove('hidden');
    });
</script>

</body>
</html>
